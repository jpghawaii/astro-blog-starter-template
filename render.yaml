# Render Blueprint for the JPG Media analytics platform (platform/).
# Creates: PostgreSQL 16 (PostGIS enabled by migration 001), the Next.js web app, and a monthly
# public-data refresh job. Values marked `sync: false` are asked for when the Blueprint is created.
databases:
  - name: jpg-analytics-db
    databaseName: jpg_analytics
    user: jpg
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: jpg-analytics
    runtime: node
    rootDir: platform
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: jpg-analytics-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_DEMO_DATA
        value: "0"
      # One-time data load via /admin/restore; set to 0 after loading the bundle.
      - key: RESTORE_ENABLED
        value: "1"
      # First admin, created only while no user exists. Remove after first login.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: cron
    name: jpg-analytics-refresh
    runtime: python
    rootDir: platform
    region: oregon
    plan: starter
    # 18:17 UTC on the 5th of each month = 8:17 am Hawaii time
    schedule: "17 18 5 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m ingest refresh-public && python -m ingest quality
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATABASE_URL
        fromDatabase:
          name: jpg-analytics-db
          property: connectionString
